    description: Core system required for all FurryOS installs
    packages:
      - mate-desktop-environment-core
      - firefox-esr
      - network-manager
      - pulseaudio
      - pipewire
      - system-tools-basic

  optional_bundles:
    gaming:
      description: Gaming tools and launchers
      popup_install: true
      desktop_shortcut: Install Gaming Tools
      packages:
        - lutris
        - steam-installer
        - mangohud

    creative:
